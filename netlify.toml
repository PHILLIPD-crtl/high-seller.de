# ---------------------------------------------------------------------------
# 4. Entdoppelung: eine Seite, eine Adresse
# ---------------------------------------------------------------------------
# Netlify liefert jede Seite unter zwei Adressen mit Status 200 aus, also
# /kontakt UND /kontakt.html. Fuer Suchmaschinen sind das zwei Seiten mit
# identischem Inhalt, und beide konkurrieren um dieselbe Suchanfrage.
#
# Massgeblich ist die .html-Fassung: alle canonical-Angaben, die sitemap.xml
# und saemtliche internen Verweise zeigen darauf. Deshalb geht die endungslose
# Adresse dauerhaft auf die .html-Fassung.
#
# force = true ist noetig, weil Netlify die endungslose Adresse sonst als
# bereits vorhandene Datei ansieht und die Regel stillschweigend uebergeht.
#
# BEIM ANLEGEN EINER NEUEN SEITE hier eine Regel ergaenzen, sonst ist die neue
# Seite sofort wieder unter zwei Adressen erreichbar.

# Startseite: die .html-Fassung auf das nackte Wurzelverzeichnis, denn das
# canonical der Startseite lautet https://high-seller.de/ .

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

