# ---------------------------------------------------------------------------
# 2. Saubere Adressen fuer die Immobilienangebote
# ---------------------------------------------------------------------------

# Uebersichtsseite.
#
# Das war bis hierher eine interne Umschreibung mit Status 200, und genau das
# war eine Doppelung: dieselbe Angebotsseite lieferte sowohl unter
# /immobilienangebote als auch unter /immobilien-angebote.html eine vollwertige
# Seite aus, und BEIDE Adressen standen in der sitemap.xml. Die kurze Adresse
# bleibt gueltig, sie leitet jetzt aber weiter, statt den Inhalt ein zweites
# Mal auszuliefern. Aus der Sitemap ist sie entfernt.
[[redirects]]
  from = "/immobilienangebote"
  to = "/immobilien-angebote.html"
  status = 301
  force = true

# Detailseiten mit sprechender Adresse: /immobilien/<slug>.
#
# Hier bleibt es bei der Umschreibung mit 200: diese Seiten werden von der
# Function erzeugt und existieren unter keiner zweiten Adresse. Es gibt also
# nichts zu entdoppeln.
[[redirects]]
  from = "/immobilien/:slug"
  to = "/.netlify/functions/property?slug=:slug"
  status = 200

