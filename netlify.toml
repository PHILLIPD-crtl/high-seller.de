#
# VORAUSSETZUNG, sonst greift keine einzige dieser Regeln: Die Domain muss in
# Netlify als Domain-Alias des Projekts "high-seller" eingetragen und ihr DNS
# von Strato auf Netlify umgestellt sein. Solange die Domain auf
# 81.169.145.160 zeigt, beantwortet Strato die Anfragen und Netlify sieht sie
