# netlify.toml — Highseller Immobilien & Finanzen
#
# REIHENFOLGE IST HIER BEDEUTUNG, NICHT GESCHMACK.
# Netlify nimmt die erste Regel, die passt, und hoert dann auf. Die Gruppen
# unten stehen deshalb in genau dieser Folge:
#
#   1. alte Domain (mit Hostangabe)   - muss zuerst kommen, sonst wuerden die
#                                       hostlosen Regeln darunter den Inhalt
#                                       der neuen Seite unter der ALTEN Domain
#                                       ausliefern und damit doppeln
#   2. interne Umschreibungen (200)   - saubere Adressen fuer die Angebote
#   3. alte Pfade ohne Hostangabe     - Sicherheitsnetz
#   4. Entdoppelung .html             - eine Seite, eine Adresse
#
# Saemtliche Weiterleitungen stehen bewusst NUR in dieser Datei. Es gibt
# zusaetzlich ein _redirects, das Netlify VOR dieser Datei auswertet; stuenden
# dort weiterhin pfadbasierte Regeln, wuerden sie die Host-Regeln aus Gruppe 1
# ueberholen und Besucher auf der alten Domain festhalten.

[build]
  publish = "."

# Netlifys "Pretty URLs" ist standardmaessig AN und schreibt beim Deploy jeden
# internen Verweis um: aus href="kontakt.html" wird href='/kontakt'. Im
# Quelltext des Projekts steht ueberall die .html-Fassung, live kam bisher
# ueberall die endungslose an.
#
# Das war die zweite Haelfte des Doppelungsproblems. Solange beide Adressen
# mit 200 antworteten, verteilte sich jede Seite auf zwei Adressen: die
# endungslose, auf die alle internen Verweise zeigten, und die .html-Fassung,
# auf die canonical und sitemap.xml zeigen.
#
# Mit den Entdopplungsregeln weiter unten waere daraus ein zweites Problem
# geworden: JEDER Menueklick haette erst eine 301 abgeholt. Deshalb hier aus.
# Damit bleiben die Verweise so, wie sie im Quelltext stehen - .html, gleich
# dem canonical, gleich der Sitemap, gleich dem, was Google indexiert hat.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

