# netlify.toml — Highseller Immobilien & Finanzen
#
# REIHENFOLGE IST HIER BEDEUTUNG, NICHT GESCHMACK.
# Netlify nimmt die erste Regel, die passt, und hoert dann auf. Die Gruppen
# unten stehen deshalb in genau dieser Folge:
#
#   2. interne Umschreibungen (200)   - saubere Adressen fuer die Angebote
#   3. alte Pfade ohne Hostangabe     - Sicherheitsnetz
#   4. Entdoppelung .html             - eine Seite, eine Adresse
#
# Gruppe 1 (alte Domain mit Hostangabe) gab es bis zum 31.07.2026 und ist
# bewusst entfallen; die Begruendung steht unten an ihrer Stelle. Die
# Nummerierung der uebrigen Gruppen bleibt, damit Verweise darauf aus
# readme.md und aus Commit-Nachrichten weiterhin stimmen.
#
# Saemtliche Weiterleitungen stehen bewusst NUR in dieser Datei. Es gibt
# zusaetzlich ein _redirects, das Netlify VOR dieser Datei auswertet;
# pfadbasierte Regeln dort wuerden die Regeln hier ueberholen.

[build]
  publish = "."

# Netlifys "Pretty URLs" ist standardmaessig AN und schreibt beim Deploy jeden
# internen Verweis um: aus href="kontakt.html" wird href='/kontakt'. Im
# Quelltext des Projekts steht ueberall die .html-Fassung, live kam bisher
# ueberall die endungslose an.
#
# Das war die zweite Haelfte des Doppelungsproblems. Solange beide Adressen
# mit 200 antworteten, verteilte sich jede Seite auf zwei Adressen: die
# endungslose, auf die alle internen Verweise zeigten, und die .html-Fassung,
# auf die canonical und sitemap.xml zeigen.
#
# Mit den Entdopplungsregeln weiter unten waere daraus ein zweites Problem
# geworden: JEDER Menueklick haette erst eine 301 abgeholt. Deshalb hier aus.
# Damit bleiben die Verweise so, wie sie im Quelltext stehen - .html, gleich
# dem canonical, gleich der Sitemap, gleich dem, was Google indexiert hat.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# ALTE DOMAIN highseller-immobilien.koeln - BEWUSST OHNE REGELN
# ---------------------------------------------------------------------------
# Hier standen 42 Weiterleitungen von der Vorgaengerdomain auf die passenden
# Seiten dieser Website. Sie sind am 31.07.2026 auf Entscheidung des Inhabers
# entfernt worden: Die alte Domain wird aufgegeben und nicht mehr auf Netlify
# gezeigt.
#
# Damit ist das hier kein Versehen, sondern Absicht. Wer die Regeln
# zurueckholen will, findet sie in der Versionsgeschichte dieser Datei.
#
# Was das kostet: highseller-immobilien.koeln antwortet weiterhin ueberall mit
# 404. Wer aus einem Google-Treffer oder ueber einen alten Verweis kommt,
# landet im Nichts statt auf der passenden Seite. Die dort aufgebaute
# Sichtbarkeit verfaellt.
#
# Falls die Entscheidung spaeter revidiert wird, sind zwei Schritte noetig,
# bevor irgendeine Regel greifen kann:
#   1. Domain in Netlify als Alias des Projekts "high-seller" eintragen
#      (Apex und www).
#   2. DNS bei Strato umstellen - A-Eintrag von 81.169.145.160 auf 75.2.60.5,
#      www als CNAME auf high-seller.netlify.app. Die MX-Eintraege dabei NICHT
#      anfassen, an der Domain haengt E-Mail ueber smtpin.rzone.de.

# ---------------------------------------------------------------------------
# 2. Saubere Adressen fuer die Immobilienangebote
# ---------------------------------------------------------------------------

# Uebersichtsseite.
#
# Das war bis hierher eine interne Umschreibung mit Status 200, und genau das
# war eine Doppelung: dieselbe Angebotsseite lieferte sowohl unter
# /immobilienangebote als auch unter /immobilien-angebote.html eine vollwertige
# Seite aus, und BEIDE Adressen standen in der sitemap.xml. Die kurze Adresse
# bleibt gueltig, sie leitet jetzt aber weiter, statt den Inhalt ein zweites
# Mal auszuliefern. Aus der Sitemap ist sie entfernt.
[[redirects]]
  from = "/immobilienangebote"
  to = "/immobilien-angebote.html"
  status = 301
  force = true

# Detailseiten mit sprechender Adresse: /immobilien/<slug>.
#
# Hier bleibt es bei der Umschreibung mit 200: diese Seiten werden von der
# Function erzeugt und existieren unter keiner zweiten Adresse. Es gibt also
# nichts zu entdoppeln.
[[redirects]]
  from = "/immobilien/:slug"
  to = "/.netlify/functions/property?slug=:slug"
  status = 200

