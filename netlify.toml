# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------

# Bilder lange cachen (immutable Dateinamen)
#
# ACHTUNG: "immutable" heisst, Browser fragen ein Jahr lang nicht nach einer
# neueren Fassung - auch hartes Neuladen hilft nicht zuverlaessig. Wer den
# INHALT einer Bilddatei aendert, muss ihr deshalb einen NEUEN DATEINAMEN
# geben und die Verweise umstellen. Eine Datei unter gleichem Namen zu
# ersetzen wirkt live nur bei Erstbesuchern.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Selbstgehostete Schriften lange cachen (immutable Dateinamen)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS mit Cache-Busting (?v=) versehen -> ebenfalls lange cachebar
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Lokale Immobilien-Datenquelle: kurz cachen, damit Änderungen zügig live sind
[[headers]]
  for = "/src/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://tagmanager.google.com https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://tagmanager.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.google-analytics.com https://stats.g.doubleclick.net https://maps.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://maps.google.com; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
