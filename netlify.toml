# 1. ALTE DOMAIN highseller-immobilien.koeln
# ---------------------------------------------------------------------------
# Die Vorgaengerseite lag auf highseller-immobilien.koeln (Strato). Sie ist
# abgeschaltet und antwortet dort auf JEDER Adresse mit einem nackten 404 -
